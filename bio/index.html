<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Teles Barbearia - Links</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Configuração de Cores (Igual ao Site Principal) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        teles: {
                            black: '#0a0a0a',
                            dark: '#141414',
                            gray: '#222222',
                            tiffany: '#0ABAB5',
                            tiffanyDark: '#089691',
                            cream: '#F5F1E6'
                        }
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        display: ['Oswald', 'sans-serif'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Fundo com Textura Noise */
        .bg-noise {
            position: relative;
            background-color: #0a0a0a;
            min-height: 100vh;
        }
        .bg-noise::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }
        
        /* Efeito de Vidro nos Botões */
        .glass-btn {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-btn:hover {
            background: rgba(10, 186, 181, 0.1);
            border-color: #0ABAB5;
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(10, 186, 181, 0.2);
        }

        /* Avatar com borda brilhante */
        .avatar-glow {
            box-shadow: 0 0 30px rgba(10, 186, 181, 0.3);
        }
    </style>
</head>
<body class="antialiased text-white bg-noise flex flex-col items-center justify-center py-12 px-4 relative">

        <!-- Footer -->
